# The test repositories: real code the tool is tried on before changes that
# affect output (docs/DESIGN.md section 11). Each is pinned to an exact commit,
# so a difference in results always comes from the tool, never from the code.
#
#   python tools/fetch_test_repos.py   clone or update them into .test-repos/
#   python tools/run_test_repos.py     measure them into .test-repos-out/
#   python tools/compare.py            show what changed against baseline.json
#
# Private repositories go in repos.local.toml next to this file (git ignores
# it), in the same format; there an entry may give `path` to a checkout on
# disk instead of `url` and `commit`. Their results stay out of baseline.json.

